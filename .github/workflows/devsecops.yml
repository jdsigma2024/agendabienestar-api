# Pipeline DevSecOps de AgendaBienestar.
# Cada push o pull request pasa por: secretos -> SAST -> SCA -> pruebas de seguridad.
#
# Version que se analiza:
#   - Ejecucion manual (Actions > devsecops > Run workflow): la que se elija.
#   - Push o pull request: seguro/ si existe; si no, vulnerable/.
name: devsecops

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Carpeta a analizar"
        type: choice
        options: [seguro, vulnerable]
        default: seguro

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # todo el historial: un secreto borrado sigue en commits viejos
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Elegir la version a analizar
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"
          elif [ -f seguro/app.py ]; then V=seguro
          else V=vulnerable; fi
          if [ ! -f "$V/app.py" ]; then
            echo "::error::No existe $V/app.py."
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Se analiza la carpeta: $V"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install bandit
      # -ll: falla solo con hallazgos de severidad media o alta
      - run: bandit -r "$VERSION" -ll

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  pruebas-seguridad:
    name: Pruebas de seguridad (pytest)
    needs: [secretos, sast, sca]
    # Se ejecuta aunque algun paso anterior falle, para ver siempre el resultado de las pruebas.
    # El pipeline sigue quedando en rojo si alguno fallo.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Elegir la version a analizar
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"
          elif [ -f seguro/app.py ]; then V=seguro
          else V=vulnerable; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Se analiza la carpeta: $V"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: APP="$VERSION" pytest -v
